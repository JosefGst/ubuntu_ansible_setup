# install-docker-ubuntu.yml - Install Docker Engine on Ubuntu
---
# Step 1: Remove any old Docker packages
- name: Remove old Docker packages if present
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - docker-compose
      - docker-compose-v2
      - docker-doc
      - podman-docker
      - containerd
      - runc
    state: absent

# Step 2: Install prerequisites
- name: Install required packages for apt over HTTPS
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
    state: present
    update_cache: true

- name: Install util-linux-extra if available (Ubuntu 22.04+)
  ansible.builtin.apt:
    name: util-linux-extra
    state: present
  ignore_errors: true

# Step 3: Add Docker's GPG key
- name: Create directory for Docker GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# Step 4: Add the Docker repository
- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ dpkg_arch.stdout }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    filename: docker

# Step 5: Install Docker Engine
- name: Install Docker Engine and related packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

# Step 6: Ensure Docker service is running
- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

# Step 7: Add users to the docker group
- name: Determine login user for docker group membership
  ansible.builtin.set_fact:
    docker_login_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['env']['USER']) }}"

- name: Add login user to the docker group
  ansible.builtin.user:
    name: "{{ docker_login_user }}"
    groups: docker
    append: true

- name: Remind to refresh shell for docker group membership
  ansible.builtin.debug:
    msg: |
      User {{ docker_login_user }} was added to the docker group.
      To use docker without sudo in your current terminal, run: newgrp docker
      Or log out and log back in.

# Step 8: Install Docker Python SDK for Ansible modules
- name: Install Docker Python SDK
  ansible.builtin.apt:
    name:
      - python3-docker
    state: present

# Step 9: Configure Docker daemon
- name: Create Docker daemon configuration
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2",
        "live-restore": true
      }
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: restart docker

# Step 10: Verify installation
- name: Check Docker version
  ansible.builtin.command: docker version
  register: docker_version
  changed_when: false

- name: Check Docker Compose version
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false

- name: Display versions
  ansible.builtin.debug:
    msg: |
      Docker: {{ docker_version.stdout_lines[0] }}
      Compose: {{ compose_version.stdout }}

- name: Run hello-world to verify Docker works
  community.docker.docker_container:
    name: hello-world
    image: hello-world
    state: started
    auto_remove: true
  register: hello_result

- name: Docker is working
  ansible.builtin.debug:
    msg: "Docker installation verified successfully."
