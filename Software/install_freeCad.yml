---
- name: Install AppImage runtime dependencies
  ansible.builtin.apt:
    name:
      - fuse3
      - libfuse2t64
    state: present
    update_cache: true

- name: Download FreeCAD AppImage
  ansible.builtin.get_url:
    url: "https://github.com/FreeCAD/FreeCAD/releases/download/1.1.1/FreeCAD_1.1.1-Linux-x86_64-py311.AppImage"
    dest: "/opt/FreeCAD_1.1.1-Linux-x86_64-py311.AppImage"
    force: true
    mode: '0755'

- name: Create symlink for FreeCAD in /usr/local/bin
  ansible.builtin.file:
    src: "/opt/FreeCAD_1.1.1-Linux-x86_64-py311.AppImage"
    dest: "/usr/local/bin/freecad"
    state: link
