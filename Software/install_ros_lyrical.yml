---
# Task file: include from a play using `ansible.builtin.include_tasks`.
- name: Install ROS Lyrical
  become: true
  block:
    - name: Update apt cache and install required packages
      ansible.builtin.apt: 
        update_cache: true
        name:
          - locales
          - software-properties-common
        state: latest 

    - name: Set locale to UTF-8
      ansible.builtin.shell: |
        locale-gen en_US en_US.UTF-8
        update-locale LC_ALL=en_US.UTF-8 LANG=en_US.UTF-8
        export LANG=en_US.UTF-8
      args:
        executable: /bin/bash

    - name: Enable universe repository
      ansible.builtin.command: add-apt-repository -y universe
      register: universe_repository
      changed_when: "'already enabled' not in (universe_repository.stdout | lower)"

    - name: Update apt cache and install curl
      ansible.builtin.apt:
        update_cache: true
        name: curl
        state: present

    - name: Get latest ROS apt source release
      ansible.builtin.uri:
        url: https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest
        return_content: true
      register: ros_apt_source_release

    - name: Set ROS apt source version fact
      ansible.builtin.set_fact:
        ros_apt_source_version: "{{ ros_apt_source_release.json.tag_name }}"

    - name: Get Ubuntu codename from os-release
      ansible.builtin.shell: |
        . /etc/os-release
        echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}"
      args:
        executable: /bin/bash
      register: ubuntu_codename_result
      changed_when: false

    - name: Download ros2 testing apt source deb
      ansible.builtin.get_url:
        url: "https://github.com/ros-infrastructure/ros-apt-source/releases/download/{{ ros_apt_source_version }}/ros2-testing-apt-source_{{ ros_apt_source_version }}.{{ ubuntu_codename_result.stdout }}_all.deb"
        dest: /tmp/ros2-testing-apt-source.deb
        mode: '0644'

    - name: Install ros2 testing apt source package
      ansible.builtin.apt:
        deb: /tmp/ros2-testing-apt-source.deb
        state: present

    
        