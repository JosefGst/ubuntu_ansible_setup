---
- name: Workstation Setup for Ubuntu 26.04
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Install apt packages
      apt:
        name:
          - vim-nox
          - git
          - libfuse2t64
          - tmux
          - curl
          - btop
          - yamllint
          - net-tools
          - nmap
        state: latest
        update_cache: true

    # - name: Install ROS Lyrical
    #   include_tasks: install_ros_lyrical.yml

    # - name: Set wallpaper
    #   become_user: josef
    #   dconf:
    #     key: "/org/gnome/desktop/background/picture-uri"
    #     value: "'file:///usr/share/backgrounds/ubuntu-default-greyscale-wallpaper.png'"

    # - name: copy dotfiles
    #   include_tasks: dotfiles/dotfiles.yml

    # - name: Install Chrome
    #   include_tasks: install_chrome.yml

    - name: Install Docker
      include_tasks: install_docker.yml

    - name: Install VS Code
      include_tasks: install_vscode.yml

    - name: Install Joplin
      include_tasks: install_joplin.yml

  handlers:
    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
